<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Remagine · All chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet"/>
<style>
:root{--pk:#FBAEBE;--grey:#5c5c5c;--soft:#f2f2f2;--line:2px solid #000;--pad:clamp(18px,4vw,48px)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font:17px/1.5 'Archivo',system-ui,Arial,sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
::selection{background:var(--pk)}a{color:inherit}button,input{font:inherit;color:inherit;border-radius:0}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid #000;outline-offset:2px}.wrap{max-width:1100px;margin:0 auto;padding:0 var(--pad);width:100%}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{min-height:44px;background:#000;color:#fff;border:var(--line);padding:10px 22px;font-weight:800;font-size:.95rem;text-decoration:none;white-space:nowrap;transition:.12s;display:inline-flex;align-items:center}
.btn:hover{background:var(--pk);color:#000}.btn:active{transform:translateY(2px)}.btn.ghost{background:#fff;color:#000}.btn.ghost:hover{background:var(--pk)}
header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:-.04em;text-decoration:none}.nav{display:flex;align-items:center;gap:clamp(14px,3vw,32px)}
.nav a:not(.btn){font-weight:700;font-size:.95rem;text-decoration:none;border-bottom:2px solid transparent}.nav a:not(.btn):hover{border-color:#000}
h1{font-weight:900;font-stretch:80%;letter-spacing:-.045em;line-height:.92}
main{flex:1;padding:clamp(32px,6vw,80px) 0 clamp(48px,8vw,96px)}
.legal{border-top:var(--line);padding:18px 0 max(24px,env(safe-area-inset-bottom));font-size:.85rem;color:var(--grey)}
.dot{display:inline-block;width:8px;height:8px;background:#000;margin-left:4px;animation:dp 1.1s infinite}.dot:nth-child(3){animation-delay:.15s}.dot:nth-child(4){animation-delay:.3s}@keyframes dp{50%{opacity:.2}}
.box{border:var(--line);padding:clamp(20px,4vw,36px);font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media(max-width:600px){body{font-size:16px}.bar{height:56px}.logo{font-size:1.35rem}.nav .hide-s{display:none}}

h1{font-size:clamp(3rem,11vw,8rem)}.sub{margin-top:18px;color:var(--grey);max-width:40ch}
.tools{margin-top:clamp(28px,4vw,48px);display:flex;border:var(--line)}.tools input{flex:1;min-width:0;border:0;padding:14px 16px;font-size:1rem;background:#fff}.tools input:focus-visible{outline:0;background:var(--soft)}.tools:focus-within{outline:3px solid #000;outline-offset:2px}
.tools span{border-left:var(--line);padding:14px 18px;font-weight:800;font-size:.9rem;display:flex;align-items:center;font-variant-numeric:tabular-nums}
#list{margin-top:28px;border-top:var(--line)}
#list a{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:22px 0;border-bottom:var(--line);text-decoration:none;transition:padding .25s,background .25s;animation:up .5s both}
#list a:hover{background:var(--pk);padding-left:16px;padding-right:16px}
#list b{font-size:.9rem;font-variant-numeric:tabular-nums}#list strong{font-weight:900;font-stretch:80%;font-size:clamp(1.3rem,3.4vw,2.4rem);letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
#list small{font-weight:700;font-size:.85rem;color:var(--grey);text-align:right}#list a:hover small{color:#000}
.empty{margin-top:40px;font-weight:700}.empty a{text-decoration:underline;text-decoration-thickness:2px}
@media(max-width:600px){#list a{grid-template-columns:34px 1fr;row-gap:6px;padding:18px 0}#list small{grid-column:2;text-align:left}}
@media(hover:none){#list a:hover{background:none;padding:18px 0}}
</style></head>
<body>
<header><div class="wrap bar"><a class="logo" href="/">Remagine</a><div class="nav"><a class="hide-s" href="/">Home</a><a class="btn" href="/">Ask AI</a></div></div></header>
<main><div class="wrap">
<h1>All chats</h1><p class="sub">Every question asked on this server, most recent first.</p>
<label class="sr" for="q">Search chats</label>
<div class="tools"><input id="q" type="search" placeholder="Search questions" autocomplete="off"/><span id="count">0</span></div>
<div id="list"></div>
<p id="empty" class="empty hidden">No chats yet. <a href="/">Ask the first one</a>.</p>
</div></main>
<footer><div class="wrap"><p class="legal">© 2026 Remagine. One question, every model's answer, one clear summary.</p></div></footer>
<script>
let all=[];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(items){
  document.getElementById('count').textContent=items.length;
  document.getElementById('list').innerHTML=items.map((s,i)=>`<a href="/chat.html?id=${encodeURIComponent(s.id)}" style="animation-delay:${Math.min(i,12)*40}ms"><b>${String(i+1).padStart(2,'0')}</b><strong>${escapeHtml(s.question)}</strong><small>${escapeHtml(new Date(s.createdAt).toLocaleString())}</small></a>`).join('');
}
async function load(){
  try{
    const res=await fetch('/api/history');const data=await res.json();
    if(!data.sessions||!data.sessions.length){document.getElementById('empty').classList.remove('hidden');return}
    all=data.sessions;draw(all);
  }catch(err){document.getElementById('list').innerHTML='<p class="box">Could not load chat history. Refresh to try again.</p>'}
}
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();draw(v?all.filter(s=>String(s.question).toLowerCase().includes(v)):all)});
load();
</script>
</body></html>
