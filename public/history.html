<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Remagine — All chats</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: { brandPink: '#FBAEBE', brandMint: '#A7F3D0', brandCoral: '#FF5C5C' }
      }
    }
  };
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background:#fff; color:#111827; }
  .crisp-border-thick { border: 2.5px solid #111827; }
  .lift-card { transition: transform .15s ease, box-shadow .15s ease; }
  .lift-card:hover { transform: translateY(-3px); box-shadow: 4px 4px 0 #111827; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="w-full border-b border-gray-900 bg-white/90 backdrop-blur sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a class="flex items-center gap-1.5" href="/">
      <span class="text-xl font-extrabold tracking-tight text-gray-950">Remagine</span>
    </a>
    <nav class="flex items-center gap-4 text-sm font-semibold text-gray-700">
      <a class="hover:text-black" href="/">Ask a question</a>
    </nav>
  </div>
</header>

<main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-10">
  <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-950">All chats</h1>
  <p class="mt-2 text-sm text-gray-600">Every question asked on this server, most recent first.</p>

  <div id="list" class="mt-8 space-y-3"></div>
  <p id="empty" class="hidden mt-10 text-center text-sm text-gray-500">No chats yet — <a class="underline font-semibold" href="/">ask the first one</a>.</p>
</main>

<script>
  async function load() {
    try {
      const res = await fetch('/api/history');
      const data = await res.json();
      const list = document.getElementById('list');
      if (!data.sessions || !data.sessions.length) {
        document.getElementById('empty').classList.remove('hidden');
        return;
      }
      list.innerHTML = data.sessions.map(s => `
        <a href="/chat.html?id=${encodeURIComponent(s.id)}" class="lift-card block crisp-border-thick rounded-2xl p-4 bg-white">
          <p class="font-semibold text-gray-950">${escapeHtml(s.question)}</p>
          <p class="mt-1 text-xs text-gray-500">${new Date(s.createdAt).toLocaleString()}</p>
        </a>`).join('');
    } catch (err) {
      document.getElementById('list').innerHTML = `<p class="text-sm text-brandCoral">Couldn't load chat history.</p>`;
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  load();
</script>
</body>
</html>
