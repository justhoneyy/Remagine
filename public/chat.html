<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Remagine — Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: {
          brandPink: '#FBAEBE', brandBlue: '#3B82F6', brandMint: '#A7F3D0',
          brandCoral: '#FF5C5C', brandYellow: '#FCD34D'
        }
      }
    }
  };
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background:#fff; color:#111827; }
  .crisp-border-thick { border: 2.5px solid #111827; }
  .dot { animation: dotPulse 1.1s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes dotPulse { 0%,100%{opacity:.25;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
  .reveal { opacity:0; transform:translateY(10px); animation: revealIn .45s ease forwards; }
  @keyframes revealIn { to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="w-full border-b border-gray-900 bg-white/90 backdrop-blur sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a class="flex items-center gap-1.5" href="/">
      <span class="text-xl font-extrabold tracking-tight text-gray-950">Remagine</span>
    </a>
    <nav class="flex items-center gap-4 text-sm font-semibold text-gray-700">
      <a class="hover:text-black" href="/history.html">All chats</a>
      <a class="hover:text-black" href="/">Ask another</a>
    </nav>
  </div>
</header>

<main class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 py-10">

  <div id="loadingState" class="hidden">
    <div class="crisp-border-thick rounded-2xl p-6 bg-white text-center">
      <p class="text-sm font-semibold text-gray-700">Loading this chat
        <span class="inline-flex gap-1 align-middle ml-1">
          <span class="dot inline-block w-1.5 h-1.5 rounded-full bg-gray-700"></span>
          <span class="dot inline-block w-1.5 h-1.5 rounded-full bg-gray-700"></span>
          <span class="dot inline-block w-1.5 h-1.5 rounded-full bg-gray-700"></span>
        </span>
      </p>
    </div>
  </div>

  <div id="errorState" class="hidden">
    <div class="crisp-border-thick rounded-2xl p-6 bg-white text-center">
      <p class="text-sm font-semibold text-brandCoral" id="errorMsg">Couldn't find that chat.</p>
      <a href="/" class="inline-block mt-4 px-5 py-2 rounded-full border-2 border-gray-950 bg-brandPink text-sm font-bold">Ask a new question</a>
    </div>
  </div>

  <div id="chatContent" class="hidden">
    <p class="text-xs font-bold text-gray-500 mb-2" id="chatDate"></p>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-950 leading-snug" id="chatQuestion"></h1>

    <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4" id="answerCards"></div>

    <div class="reveal mt-6 rounded-2xl p-5 bg-[#FFF5F3] border-[2.5px] border-gray-950">
      <p class="text-xs font-extrabold tracking-wide text-gray-700">Summary</p>
      <p class="mt-2 text-sm text-gray-900 leading-relaxed" id="chatSummary"></p>
    </div>

    <div class="mt-8 flex justify-center">
      <a href="/" class="press-btn px-6 py-2.5 rounded-full border-2 border-gray-950 bg-brandPink text-sm font-bold text-gray-950">Ask another question</a>
    </div>
  </div>

</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  const chatContent = document.getElementById('chatContent');

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  async function load() {
    if (!id) {
      document.getElementById('errorMsg').textContent = 'No chat id was given.';
      show(errorState);
      return;
    }
    show(loadingState);
    try {
      const res = await fetch(`/api/session/${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error('Chat not found');
      const session = await res.json();
      render(session);
    } catch (err) {
      document.getElementById('errorMsg').textContent = 'That chat could not be loaded — it may have expired.';
      hide(loadingState);
      show(errorState);
    }
  }

  function render(session) {
    document.title = `Remagine — ${session.question}`;
    document.getElementById('chatDate').textContent = new Date(session.createdAt).toLocaleString();
    document.getElementById('chatQuestion').textContent = session.question;

    const cards = session.answers.map(a => `
      <div class="reveal rounded-xl p-4 border-2 ${a.color || 'border-gray-900'} bg-white">
        <p class="text-xs font-extrabold tracking-wide text-gray-500">${escapeHtml(a.name)}</p>
        <p class="mt-1.5 text-sm text-gray-800 leading-relaxed">${escapeHtml(a.text)}</p>
      </div>`).join('');
    document.getElementById('answerCards').innerHTML = cards;
    document.getElementById('chatSummary').textContent = session.summary;

    hide(loadingState);
    show(chatContent);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  load();
</script>
</body>
</html>
